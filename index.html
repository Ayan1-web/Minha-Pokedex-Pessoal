<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex Pessoal</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <p id="carregando" class="carregando">Carregando…</p>

  <!-- TELA DE LOGIN -->
  <main id="tela-login" class="login" hidden>
    <div class="login-cartao">
      <div class="pokebola" aria-hidden="true"></div>
      <h1>Pokédex Pessoal</h1>
      <p>Entre com a sua conta Google para abrir a sua Pokédex.</p>
      <div id="botao-google"></div>
      <p id="erro" class="erro" role="alert" hidden></p>
    </div>
  </main>

  <!-- DASHBOARD (só aparece depois do login) -->
  <div id="tela-app" hidden>
    <header class="topo">
      <div class="marca"><span class="pokebola mini" aria-hidden="true"></span> Pokédex Pessoal</div>
      <div class="usuario">
        <img id="foto" alt="" width="40" height="40" referrerpolicy="no-referrer">
        <div class="usuario-texto"><strong id="nome"></strong><small id="email"></small></div>
        <button id="sair" type="button" class="btn-sair">Sair</button>
      </div>
    </header>

    <main class="conteudo">
      <section class="resumo" aria-label="Resumo">
        <div class="stat azul"><span id="r-total">0</span><small>Pokémon na Pokédex</small></div>
        <div class="stat rosa"><span id="r-fav">0</span><small>Favoritos</small></div>
        <div class="stat amarelo"><span id="r-forte">–</span><small>Maior ataque</small></div>
        <div class="stat verde"><span id="r-rapido">–</span><small>Mais veloz</small></div>
      </section>

      <section class="filtros" aria-label="Filtros">
        <input id="busca" type="search" placeholder="Buscar por nome ou número…" aria-label="Buscar Pokémon">
        <select id="filtro-tipo" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option></select>
        <button id="so-fav" type="button" class="chip" aria-pressed="false">★ Só favoritos</button>
      </section>

      <section id="grade" class="grade" aria-live="polite"></section>
      <p id="vazio" class="vazio" hidden>Nenhum Pokémon encontrado.</p>
    </main>
  </div>

  <!-- DETALHES -->
  <dialog id="detalhe" class="detalhe"></dialog>

  <script src="/app.js"></script>
</body>
</html>
